<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap');
    body { margin: 0; font-family: 'Heebo', system-ui, sans-serif; direction: rtl; }
    a { color: #D2BA84; } a:hover { color: #F7F5F0; }

    .dotgrid { background-image: radial-gradient(rgba(210,186,132,.13) 1px, transparent 1px); background-size: 26px 26px; }
    .mark { position: relative; padding-inline-start: 1.15rem; }
    .mark::before { content: ""; position: absolute; inset-inline-start: 0; top: .1em;
      width: .5rem; height: .5rem; border-top: 1.5px solid currentColor; border-inline-start: 1.5px solid currentColor; }

    .frame span { position: absolute; width: 15px; height: 15px; border: 1px solid rgba(210,186,132,.4); }
    .frame span:nth-child(1) { inset-block-start: 0; inset-inline-start: 0; border-inline-end: 0; border-block-end: 0; }
    .frame span:nth-child(2) { inset-block-start: 0; inset-inline-end: 0; border-inline-start: 0; border-block-end: 0; }
    .frame span:nth-child(3) { inset-block-end: 0; inset-inline-start: 0; border-inline-end: 0; border-block-start: 0; }
    .frame span:nth-child(4) { inset-block-end: 0; inset-inline-end: 0; border-inline-start: 0; border-block-start: 0; }

    .hairline { position: absolute; inset-inline: 26px; height: 1px; background: rgba(210,186,132,.18); overflow: hidden; }
    .hairline i { position: absolute; inset-block: 0; width: 140px;
      background: linear-gradient(to left, transparent, #EDE5D2, transparent);
      animation: streak 5.5s cubic-bezier(.6,0,.4,1) infinite; }
    @keyframes streak { 0% { inset-inline-start: -140px; } 100% { inset-inline-start: 100%; } }

    .meter { display: inline-flex; align-items: center; gap: .55rem; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: rgba(247,245,240,.7); }
    .meter b { display: flex; gap: 3px; }
    .meter b s { width: 2px; height: 11px; background: rgba(210,186,132,.35); text-decoration: none; }
    .meter b s.on { background: #EDE5D2; }

    .ghostword { position: absolute; inset-inline: 40px; display: flex; justify-content: space-between;
      pointer-events: none; font-weight: 700; font-size: 13px; letter-spacing: .08em; color: rgba(247,245,240,.22); }

    .dotbtn { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 9999px;
      border: 1px solid rgba(210,186,132,.22); color: rgba(247,245,240,.45); background: rgba(247,245,240,.04);
      transition: color .45s, border-color .45s, background-color .45s, box-shadow .45s, transform .45s cubic-bezier(.2,.7,.3,1); }
    .dotbtn.on { border-color: rgba(210,186,132,.9); color: #0B1220;
      background: radial-gradient(circle at 34% 28%, #F6E6B4, #B4892B);
      box-shadow: 0 0 38px rgba(180,137,43,.5); transform: scale(1.1); }
    .dotsep { width: 1px; height: 30px; margin: 7px auto; background: rgba(210,186,132,.2); }

    .myth { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(180,137,43,.95); }
    @keyframes panelIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    .panel { animation: panelIn .6s cubic-bezier(.2,.7,.3,1) both; }

    .medal { position: relative; transform-style: preserve-3d; width: 330px; height: 330px;
      filter: drop-shadow(0 44px 60px rgba(0,0,0,.6)); animation: turn 9s ease-in-out infinite alternate; }
    @keyframes turn { from { transform: rotateX(9deg) rotateY(-70deg); } to { transform: rotateX(9deg) rotateY(70deg); } }
    .medal > i { position: absolute; inset: 0; border-radius: 50%; }
    .m-face { transform: translateZ(16px);
      background: radial-gradient(circle at 30% 24%, #F7F5F0 2%, #EDE5D2 18%, #D2BA84 42%, #B4892B 66%, #524425 96%);
      box-shadow: inset 0 0 0 3px rgba(247,245,240,.55), inset 0 0 0 16px rgba(82,68,37,.35),
        inset 0 0 0 19px rgba(247,245,240,.3), inset -18px -26px 54px rgba(62,54,35,.55),
        inset 22px 26px 46px rgba(247,245,240,.30); }
    .m-teeth { transform: translateZ(15px);
      background: repeating-conic-gradient(from 0deg, rgba(82,68,37,.75) 0deg 1.4deg, rgba(224,207,171,.75) 1.4deg 2.8deg);
      -webkit-mask-image: radial-gradient(circle, transparent 87%, #000 88%);
              mask-image: radial-gradient(circle, transparent 87%, #000 88%); }
    .m-back { transform: translateZ(-16px) rotateY(180deg);
      background: radial-gradient(circle at 66% 74%, #D2BA84, #927129 58%, #3E3623);
      box-shadow: inset 0 0 0 14px rgba(62,54,35,.5); }
    .m-rim { transform: translateZ(0);
      background: conic-gradient(from 200deg, #524425, #D2BA84 12%, #705927 26%, #EDE5D2 44%, #705927 60%, #D2BA84 78%, #524425); }
    .glyph { position: absolute; inset: 0; display: grid; place-items: center; transform: translateZ(18px); }
    .glyph span { font-size: 76px; font-weight: 900; line-height: 1; color: #3E3623;
      text-shadow: 0 2px 0 rgba(247,245,240,.55), 0 -1px 2px rgba(62,54,35,.6); }
  </style>
</helmet>
<div class="dotgrid" style="width: 1240px; height: 760px; box-sizing: border-box; background: #0B1220; color: #F7F5F0; position: relative; overflow: hidden;">

  <div style="position: absolute; inset-inline: -20%; bottom: -46%; height: 118%; pointer-events: none;
    background: radial-gradient(ellipse 52% 60% at 50% 100%, rgba(180,137,43,.42), rgba(180,137,43,.12) 42%, transparent 72%);"></div>

  <div class="frame" style="position: absolute; inset: 26px; pointer-events: none;">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="hairline" style="top: 92px;"><i></i></div>
  <div class="hairline" style="bottom: 92px;"></div>

  <div style="position: absolute; top: 110px; inset-inline: 40px; display: flex; align-items: center; justify-content: space-between;">
    <span class="meter">מסלול<b><s class="on"></s><s></s><s></s></b></span>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: .24em; color: rgba(247,245,240,.45);">האתגר</span>
  </div>

  <div class="ghostword" style="top: 190px;">
    <span>ל</span><span>פ</span><span>נ</span><span>י</span><span>ש</span><span>מ</span><span>ת</span><span>ח</span><span>י</span><span>ל</span><span>י</span><span>ם</span>
  </div>

  <div style="position: absolute; inset: 0; display: grid; place-items: center end; padding-inline-end: 110px; pointer-events: none; perspective: 1400px;">
    <div class="medal">
      <i class="m-rim"></i>
      <i class="m-back"></i>
      <i class="m-face"></i>
      <i class="m-teeth"></i>
      <div class="glyph"><span>₪</span></div>
    </div>
  </div>
  <div style="position: absolute; inset-inline-end: 110px; bottom: 118px; width: 330px; height: 46px; pointer-events: none;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(180,137,43,.5), transparent 70%); filter: blur(6px);"></div>

  <div class="panel" style="position: absolute; inset-block: 0; inset-inline-start: 150px; width: 400px;
    display: flex; flex-direction: column; justify-content: center;">
    <span class="myth" style="align-self: flex-start; font-size: 14px; font-weight: 700; color: rgba(247,245,240,.65);">״הכסף בטוח בעו״ש״</span>
    <h2 style="margin: 16px 0 0; font-size: 66px; font-weight: 900; line-height: .96; letter-spacing: -.02em;">כסף<br>שממתין</h2>
    <p style="margin: 24px 0 0; max-width: 340px; font-size: 18px; line-height: 1.6; color: rgba(247,245,240,.55);">
      כל שנה בעו״ש היא שנה שהאינפלציה גובה. הזמן הוא הנכס היחיד שאי אפשר לקנות בחזרה.
    </p>
    <span style="margin-top: 32px; font-size: 12px; font-weight: 700; letter-spacing: .24em; color: #D2BA84;">01 / 03</span>
  </div>

  <nav style="position: absolute; inset-inline-start: 44px; top: 50%; transform: translateY(-50%); z-index: 3;">
    <div class="dotbtn on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width: 20px; height: 20px;">
        <ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"></path><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path>
      </svg>
    </div>
    <div class="dotsep"></div>
    <div class="dotbtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width: 20px; height: 20px;">
        <circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path>
      </svg>
    </div>
    <div class="dotsep"></div>
    <div class="dotbtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width: 20px; height: 20px;">
        <path d="M12 3v18"></path><path d="M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.6 7 6.5 9.2 10 12 10.5s5 1.6 5 3.5-2.2 3.5-5 3.5-5-1.1-5-3"></path>
      </svg>
    </div>
  </nav>

</div>
</x-dc>
</body>
</html>
